services:
  - type: web
    name: interviewiq
    runtime: docker
    plan: free
    region: singapore
    rootDir: ai-interview-platform
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: "tidb"
      - key: TIDB_HOST
        sync: false
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: TIDB_DATABASE
        value: "interviewiq"
      - key: TIDB_SSL_MODE
        value: "VERIFY_IDENTITY"
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: APP_SEED
        value: "true"
      - key: APP_DEMO_PASSWORD
        value: "Demo!Access2026"
      - key: APP_CORS_ORIGINS
        value: "*"
